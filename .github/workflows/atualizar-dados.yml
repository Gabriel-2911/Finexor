name: Atualizar dataset

# Segunda a sexta às 22h BRT (01h UTC do dia seguinte), depois do fechamento
# da B3 e da consolidação do CDI no SGS.
on:
  schedule:
    - cron: "0 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar dataset
        run: python scripts/generate_data.py

      - name: Publicar se mudou
        run: |
          if git diff --quiet docs/assets/data/dataset.json; then
            echo "Sem alteração no dataset — nada a publicar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/dataset.json
          git commit -m "dados: atualização automática de $(date -u +%Y-%m-%d)"
          git push
